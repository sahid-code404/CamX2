name: Run CP3 no-hang hotfix

on:
  push:
    branches:
      - phase/camx2-computational-photo-integration

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.head_commit.message == 'Run staged CP3 no-hang hotfix'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: phase/camx2-computational-photo-integration
          fetch-depth: 0

      - name: Apply staged patch
        run: |
          set -euo pipefail
          python3 tools/cp3_nohang_hotfix.py
          git rm tools/cp3_nohang_hotfix.py
          git rm .github/workflows/run-cp3-nohang-hotfix.yml
          git rm -f .github/workflows/one-shot-cp3-nohang-hotpath.yml
          git diff --check
          git diff --stat

      - name: Run targeted tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --tests '*Cp3ComputationalRawEngineTest' --tests '*Cp4ComputationalDngWriterTest' --tests '*RawBurstTimestampPairerTest'

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize computational RAW hot paths'
          git push origin HEAD:phase/camx2-computational-photo-integration
