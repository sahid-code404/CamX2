name: M10 ImageReader Lease Fix

on:
  push:
    branches:
      - phase/camx2-m10-image-lease-fix
  workflow_dispatch:

jobs:
  validate:
    name: Validate and build M10 lease fix
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      CI: "true"
      CAMX_SOURCE_SHA: ${{ github.sha }}
      CAMX_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$CAMX_SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          dependency-graph: disabled

      - name: Install guard tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Install pinned Android toolchain
        run: ./scripts/install-android-sdk.sh

      - name: Resolve exact development version
        run: |
          set -euo pipefail
          version_code=$((1100000 + GITHUB_RUN_NUMBER))
          test "$version_code" -le 2100000000
          short_sha="${CAMX_SOURCE_SHA:0:12}"
          echo "DEV_OTA_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "DEV_OTA_VERSION_NAME=0.1.0-m10fix.${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_ENV"

      - name: Verify M10 ownership contracts
        run: |
          ./scripts/verify-camera-owner.sh
          ./scripts/verify-resource-ownership.sh
          bash ./scripts/verify-m10-raw-video.sh
          bash ./scripts/verify-camera-capture-ui.sh

      - name: Run host native tests
        run: ./scripts/test-native.sh

      - name: Compile, test, lint, and assemble signed APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:verifyApi23Baseline :app:testDebugUnitTest :app:lintDevOta :app:assembleDevOta \
            -PdevOtaVersionCode="$DEV_OTA_VERSION_CODE" \
            -PdevOtaVersionName="$DEV_OTA_VERSION_NAME"

      - name: Report exact unit-test count
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not files:
              raise SystemExit("No testDebugUnitTest JUnit XML reports were produced")
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in files:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, "0"))
          print(f"CamX unit tests: tests={totals['tests']} failures={totals['failures']} errors={totals['errors']} skipped={totals['skipped']}")
          if totals["failures"] or totals["errors"]:
              sys.exit(1)
          PY

      - name: Verify packaged native API-23 boundary
        run: |
          apk="$(find app/build/outputs/apk/devOta -type f -name '*.apk' | head -n 1)"
          test -f "$apk"
          ./scripts/verify-native-api23.sh "$apk"

      - name: Package verified signed APK
        run: |
          apk="$(find app/build/outputs/apk/devOta -type f -name '*.apk' | head -n 1)"
          test -f "$apk"
          ./scripts/package-dev-ota.sh "$apk" artifacts-m10-fix "$CAMX_SOURCE_SHA"
          ./scripts/verify-packaged-ota.sh artifacts-m10-fix

      - name: Upload M10 fix artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CamX-M10-image-lease-fix-${{ github.sha }}
          path: artifacts-m10-fix/
          if-no-files-found: error
          retention-days: 21
